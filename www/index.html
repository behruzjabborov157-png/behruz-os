<style>
  /* Layout: chapda boʻlimlar paneli (telefonda pastki menyu), oʻngda bitta ustunli ish maydoni; lojuvard (lapis) urgʻu */
  :root {
    --bg: #f3f4f8; --surface: #ffffff; --surface-2: #eceef4; --line: #dfe2ea;
    --fg: #141823; --muted: #5c6478; --accent: #3d4fd6; --accent-fg: #ffffff; --accent-soft: #e6e9fb;
    --ok: #0f8a6a; --ok-soft: #dcf2ea; --warn: #a86a12; --warn-soft: #fbefd9; --bad: #c63737; --bad-soft: #fbe3e3; --mid: #2a72b0; --mid-soft: #e0edf8;
    --c1: #3d4fd6; --c2: #0f8a6a; --c3: #d08a1c; --c4: #9b46c9; --c5: #d0453a; --c6: #2a8fb8;
    --shadow: 0 1px 2px rgba(20, 24, 35, .05), 0 6px 20px -12px rgba(20, 24, 35, .18);
    --f-display: "Bricolage Grotesque", "Onest", "Segoe UI", system-ui, sans-serif;
    --f-body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    --f-kr: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --r: 12px; --r-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f15; --surface: #151821; --surface-2: #1c2030; --line: #2a2f40;
      --fg: #e7e9f0; --muted: #9aa1b5; --accent: #8191ff; --accent-fg: #0d0f15; --accent-soft: #232a4d;
      --ok: #3cc59c; --ok-soft: #12342b; --warn: #e3ac4f; --warn-soft: #3a2c12; --bad: #f07272; --bad-soft: #3d1b1d; --mid: #64aee8; --mid-soft: #15293b;
      --c1: #8191ff; --c2: #3cc59c; --c3: #e3ac4f; --c4: #c08ae8; --c5: #f07272; --c6: #5cc2e8;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f15; --surface: #151821; --surface-2: #1c2030; --line: #2a2f40;
    --fg: #e7e9f0; --muted: #9aa1b5; --accent: #8191ff; --accent-fg: #0d0f15; --accent-soft: #232a4d;
    --ok: #3cc59c; --ok-soft: #12342b; --warn: #e3ac4f; --warn-soft: #3a2c12; --bad: #f07272; --bad-soft: #3d1b1d; --mid: #64aee8; --mid-soft: #15293b;
    --c1: #8191ff; --c2: #3cc59c; --c3: #e3ac4f; --c4: #c08ae8; --c5: #f07272; --c6: #5cc2e8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; }
  p { margin: 0; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ic.fl { color: var(--warn); } .ic.muted { color: var(--muted); }
  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .92em; }
  .kr { font-family: var(--f-kr); }
  .ar { font-family: "Noto Naskh Arabic", "Amiri", "Geeza Pro", "Traditional Arabic", serif; font-size: 1.25em; line-height: 1.9; }
  .muted { color: var(--muted); } .sm { font-size: .84rem; } .center { text-align: center; justify-content: center; } .end { justify-content: flex-end; }
  .neg, .bad-t { color: var(--bad); } .ok-t { color: var(--ok); } .warn-t { color: var(--warn); }
  .dim { opacity: .62; }

  /* ---------- shell ---------- */
  .boot { min-height: 70vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); }
  .boot-mark, .brand-mark { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
  .boot-mark { width: 56px; height: 56px; font-size: 1.6rem; border-radius: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 1.1rem; letter-spacing: .02em; }
  .side { display: none; }
  .main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; background: var(--bg); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .top-title { font-family: var(--f-display); font-size: 1.35rem; }
  .top-r { display: flex; align-items: center; gap: 8px; }
  .sync { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); white-space: nowrap; }
  .sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .sync.mid i { background: var(--warn); } .sync.bad i { background: var(--bad); } .sync.bad { color: var(--bad); }
  .lv-mini { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: .82rem; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .lv-mini .ic { width: 14px; height: 14px; }
  .view { display: grid; gap: 16px; max-width: 1180px; margin: 0 auto; padding-bottom: 24px; }
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-sm); margin-bottom: 12px; font-size: .9rem; max-width: 1180px; margin-inline: auto; }
  .banner span { flex: 1; min-width: 0; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); } .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bn { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border: 0; background: none; color: var(--muted); text-decoration: none; font-size: .7rem; border-radius: 10px; cursor: pointer; }
  .bn.on { color: var(--accent); background: var(--accent-soft); }
  .bn .ic { width: 22px; height: 22px; }
  .more-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .more-i { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); cursor: pointer; text-align: left; }
  .more-i:hover { border-color: var(--accent); }

  @media (min-width: 960px) {
    .side { display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; width: 236px; padding: calc(18px + env(safe-area-inset-top, 0px)) 12px 16px max(12px, env(safe-area-inset-left, 0px)); background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; }
    .side .brand { padding: 0 8px 18px; }
    .side-nav { display: grid; gap: 2px; }
    .nav-i { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-weight: 500; font-size: .92rem; }
    .nav-i:hover { background: var(--surface-2); color: var(--fg); }
    .nav-i.on { background: var(--accent-soft); color: var(--accent); }
    .side-foot { margin-top: auto; padding: 16px 8px 0; }
    .main { margin-left: 236px; padding-left: 32px; padding-right: max(32px, env(safe-area-inset-right, 0px)); padding-block: 0 32px; }
    .bottom { display: none; }
    .top { padding-block: 22px 16px; max-width: 1180px; margin: 0 auto; }
    .top-title { font-size: 1.6rem; }
  }
  .lvl { display: grid; gap: 6px; font-size: .82rem; color: var(--muted); }
  .lvl-row { display: flex; justify-content: space-between; } .lvl b { color: var(--fg); }

  /* ---------- building blocks ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 16px; }
  .grid > * { min-width: 0; }
  @media (min-width: 760px) { .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } }
  .stack { display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .row.wrap { flex-wrap: wrap; } .gap8 { gap: 8px; } .between { justify-content: space-between; }
  .sh { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .sh h2 { font-size: 1.02rem; font-weight: 600; }
  .sh-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sub { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-top: 4px; }
  .eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
  .big { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; }
  .note { padding: 10px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: .88rem; display: flex; gap: 8px; align-items: flex-start; }
  .note.ok { background: var(--ok-soft); color: var(--ok); }
  .note .ic { margin-top: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 600; font-size: .9rem; cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .btn.danger.ghost { background: transparent; color: var(--bad); }
  .btn.sm { padding: 6px 10px; font-size: .82rem; }
  .btn .ic { width: 16px; height: 16px; }
  .btn:disabled, .ibtn:disabled { opacity: .4; cursor: not-allowed; }
  .ibtn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-sm); border: 0; background: transparent; color: var(--muted); cursor: pointer; flex: none; }
  .ibtn:hover:not(:disabled) { background: var(--surface-2); color: var(--fg); }
  .linkish { border: 0; background: none; padding: 0; color: inherit; font-weight: 600; cursor: pointer; text-align: left; }
  .linkish:hover { color: var(--accent); }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .chip .ic { width: 13px; height: 13px; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.mid { background: var(--mid-soft); color: var(--mid); }
  .chip.ghostchip { background: transparent; border: 1px solid var(--line); font-weight: 500; }
  .btnchip { border: 1px solid var(--line); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .btnchip:hover { border-color: var(--accent); color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips.pick label { cursor: pointer; } .chips.pick input { position: absolute; opacity: 0; pointer-events: none; }
  .chips.pick span { display: inline-block; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font-size: .85rem; }
  .chips.pick input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .chips.pick input:focus-visible + span { outline: 2px solid var(--accent); }
  .tag { font-size: .7rem; padding: 1px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-weight: 600; white-space: nowrap; }
  .tag.uni { background: var(--accent-soft); color: var(--accent); } .tag.work { background: var(--warn-soft); color: var(--warn); }

  .bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .bar.bad i { background: var(--bad); } .bar.na i { background: transparent; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: none; padding: 8px 12px; border-radius: var(--r-sm); color: var(--muted); font-weight: 600; font-size: .88rem; cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--fg); } .tab.on { background: var(--accent-soft); color: var(--accent); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--surface-2); border-radius: var(--r-sm); }
  .seg.wide { display: flex; } .seg.wide .seg-b { flex: 1; text-align: center; }
  .seg-b { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .seg-b input { position: absolute; opacity: 0; pointer-events: none; }
  label.seg-b:has(input:checked) { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .seg-b.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .seg-b.on.ok { background: var(--ok); color: #fff; } .seg-b.on.warn { background: var(--warn); color: #fff; } .seg-b.on.bad { background: var(--bad); color: #fff; } .seg-b.on.mid { background: var(--mid); color: #fff; }
  .seg.sm .seg-b { padding: 4px 7px; font-size: .74rem; }

  .chk { width: 26px; height: 26px; flex: none; display: inline-grid; place-items: center; border-radius: 8px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; color: #fff; padding: 0; }
  .chk:hover { border-color: var(--accent); }
  .chk.on { background: var(--ok); border-color: var(--ok); }
  .chk.miss { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .chk .ic { width: 16px; height: 16px; stroke-width: 2.6; }

  .list { list-style: none; margin: 0; padding: 0; display: grid; }
  .li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .li:last-child { border-bottom: 0; }
  .li-t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .li-t.done { color: var(--muted); text-decoration: line-through; }
  .list.compact .li { padding: 6px 0; }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .88rem; }
  .kv span { color: var(--muted); } .kv b { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .empty { display: grid; gap: 8px; justify-items: start; padding: 22px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }
  .empty p { color: var(--muted); max-width: 60ch; }
  .tbl-w { overflow-x: auto; margin-inline: -4px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl .r { text-align: right; } .tbl tfoot td { font-weight: 700; border-bottom: 0; }
  .tbl input, .tbl select { min-width: 70px; }

  /* forms */
  .field { display: grid; gap: 5px; min-width: 0; }
  .fl { font-size: .8rem; font-weight: 600; color: var(--muted); }
  .fh { font-size: .76rem; color: var(--muted); }
  input:not([type=checkbox]):not([type=radio]):not([type=color]), select, textarea { width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
  input[type=color] { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding: 3px; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
  .cbx { display: flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
  .cbx input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .ferr { color: var(--bad); font-size: .86rem; min-height: 0; }
  .ferr:empty { display: none; }
  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .inline-form input { flex: 1 1 140px; }
  .inline-form .ferr { flex-basis: 100%; }
  .daypick { display: flex; flex-wrap: wrap; gap: 6px; }
  .daypick label { cursor: pointer; } .daypick input { position: absolute; opacity: 0; pointer-events: none; }
  .daypick span { display: inline-grid; place-items: center; width: 40px; height: 36px; border: 1px solid var(--line); border-radius: var(--r-sm); font-weight: 600; font-size: .85rem; }
  .daypick input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .daypick input:focus-visible + span { outline: 2px solid var(--accent); }
  .fs { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: grid; gap: 8px; margin: 0; }
  .fs legend { font-size: .8rem; font-weight: 600; color: var(--muted); padding: 0 4px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters select { width: auto; flex: 0 1 auto; }
  .search { display: flex; align-items: center; gap: 6px; flex: 1 1 200px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); color: var(--muted); }
  .search input { border: 0 !important; padding-inline: 0 !important; background: none !important; outline: none !important; }
  .datenav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .dn-l { font-weight: 600; padding: 0 6px; min-width: 0; }

  /* modal & toast */
  .ov { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 16, .5); display: grid; place-items: end center; padding-top: env(safe-area-inset-top, 0px); }
  .modal { width: 100%; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (min-width: 640px) { .ov { place-items: center; padding: 24px; } .modal { max-width: 560px; border-radius: 16px; } .modal.wide { max-width: 820px; } }
  .mh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 6px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .mh h3 { font-size: 1.1rem; }
  .mb { display: grid; gap: 12px; padding: 8px 18px 18px; }
